<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login - Quiz Master</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<!-- Navigation Bar -->
	<nav>
		<div class="logo">QUIZ MASTER</div>

		<div class="nav-links">
			<a href="index.html">Home</a>
			<a href="#">Courses</a>
			<a href="#">Quizzes</a>
			<a href="#">Results</a>
			<a href="login.html">Login</a>
			<a href="register.html">Register here</a>
		</div>
	</nav>

	<!-- Login Section -->
	<main>
		<section class="login-section">
			<div class="login-box">
				<h1>Login</h1>
				<p class="login-subtitle">Welcome back! Please login to your account.</p>

				<!-- Email -->
				<div class="form-group">
					<label for="email">Email Address</label>
					<input type="email" id="email" placeholder="Enter your email">
				</div>

				<!-- Password -->
				<div class="form-group">
					<label for="password">Password</label>
					<input type="password" id="password" placeholder="Enter your password">
				</div>

				<!-- Remember Me -->
				<div class="remember">
					<label>
						<input type="checkbox">
						Remember me
					</label>
					<a href="#">Forgot Password?</a>
				</div>

				<!-- Login Button -->
				<!-- Login Button -->
<button type="button" class="login-button" onclick="loginUser()">Login</button>

				<!-- Register -->
				<p class="register-text">
					Don't have an account?
					<a href="register.html">Register here</a>
				</p>
			</div>
		</section>
	</main>

	<!-- Footer -->
	<footer>
		<p>© 2026 Quiz Master. All Rights Reserved.</p>
	</footer>
	<script>
function loginUser() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (email === "" || password === "") {
        alert("Please enter your email and password.");
        return;
    }

    window.location.href = "index.html";
}
</script>
</body>

</html>

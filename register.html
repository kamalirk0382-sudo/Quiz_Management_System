<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Student Registration - Quiz Master</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<!-- ==================== NAVIGATION BAR ==================== -->
	<nav>
		<div class="logo">QUIZ MASTER</div>

		<div class="nav-links">
			<a href="index.html">Home</a>
			<a href="#">Courses</a>
			<a href="#">Quizzes</a>
			<a href="#">Results</a>
			<a href="login.html">Login</a>
			<a href="register.html">Register here</a>
		</div>
	</nav>

	<!-- ==================== REGISTRATION SECTION ==================== -->
	<main>
		<section class="register-section">
			<div class="register-box">
				<h1>Student Registration</h1>
				<p class="register-subtitle">Create your Quiz Master account</p>

				<div class="form-group">
					<label for="fullname">Full Name</label>
					<input type="text" id="fullname" placeholder="Enter your full name">
				</div>

				<div class="form-group">
					<label for="register-email">Email Address</label>
					<input type="email" id="register-email" placeholder="Enter your email">
				</div>

				<div class="form-group">
					<label for="phone">Phone Number</label>
					<input type="tel" id="phone" placeholder="Enter your phone number">
				</div>

				<div class="form-group">
					<label for="student-id">Student ID</label>
					<input type="text" id="student-id" placeholder="Enter your student ID">
				</div>

				<div class="form-group">
					<label for="register-password">Password</label>
					<input type="password" id="register-password" placeholder="Create a password">
				</div>

				<div class="form-group">
					<label for="confirm-password">Confirm Password</label>
					<input type="password" id="confirm-password" placeholder="Confirm your password">
				</div>

				<div class="terms">
					<label>
						<input type="checkbox">
						I agree to the Terms and Conditions
					</label>
				</div>

				<button type="button" class="register-button" onclick="createAccount()">Create Account</button>

				<p class="login-text">
					Already have an account?
					<a href="login.html">Login here</a>
				</p>
			</div>
		</section>
	</main>

	<!-- ==================== FOOTER ==================== -->
	<footer>
		<p>© 2026 Quiz Master. All Rights Reserved.</p>
	</footer>
	<script>
function createAccount() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (email === "" || password === "") {
        alert("Please fill in all required fields.");
        return;
    }

    localStorage.setItem("registeredEmail", email);
    localStorage.setItem("registeredPassword", password);

    alert("Account created successfully!");
    window.location.href = "login.html";
}
</script>
</body>

</html>
